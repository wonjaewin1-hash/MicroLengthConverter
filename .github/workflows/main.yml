name: Build UnitConv

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Write source files
        run: |
          mkdir -p app/Resources
          cat > 'app/AppDelegate.h' <<'__EOF__'
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          __EOF__
          cat > 'app/AppDelegate.m' <<'__EOF__'
          #import "AppDelegate.h"
          #import "UnitViewController.h"

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;
              self.window.rootViewController = [[UnitViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end
          __EOF__
          cat > 'app/Makefile' <<'__EOF__'
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64
          INSTALL_TARGET_PROCESSES = UnitConv

          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = UnitConv

          UnitConv_FILES = main.m AppDelegate.m UnitViewController.m
          UnitConv_FRAMEWORKS = UIKit
          UnitConv_CFLAGS = -fobjc-arc -Wno-deprecated-declarations -Wno-error

          include $(THEOS_MAKE_PATH)/application.mk
          __EOF__
