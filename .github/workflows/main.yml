          #import "UnitViewController.h"

          #define UC_ORANGE [UIColor colorWithRed:1.0 green:0.62 blue:0.04 alpha:1.0]
          #define UC_DARK   [UIColor colorWithWhite:0.20 alpha:1.0]
          #define UC_LIGHT  [UIColor colorWithWhite:0.65 alpha:1.0]
          #define UC_BOX    [UIColor colorWithWhite:0.11 alpha:1.0]

          static const NSUInteger kMaxLength = 15;

          @interface UnitViewController ()
          @property (nonatomic, strong) NSArray<NSString *> *unitNames;   // 화면에 보이는 이름
          @property (nonatomic, strong) NSArray<NSNumber *> *unitFactors; // 1 단위 = 기준 단위 몇 개 (길이: Å, 넓이: m²)
          @property (nonatomic, assign) NSInteger mode;                   // 0 = 길이, 1 = 넓이
          @property (nonatomic, strong) UISegmentedControl *modeControl;
          @property (nonatomic, strong) NSArray<UILabel *> *unitLabels;
          @property (nonatomic, assign) NSInteger active;                 // 입력 중인 단위
          @property (nonatomic, strong) NSMutableString *input;           // 입력 중인 숫자
          @property (nonatomic, assign) BOOL fresh;                       // 단위를 바꾼 직후 (다음 숫자가 새로 입력)
          @property (nonatomic, assign) double heldA;                     // 단위를 바꿀 때 이어받은 값 (Å)
          @property (nonatomic, assign) BOOL hasHeld;
          @property (nonatomic, strong) NSArray<UIView *> *rows;
          @property (nonatomic, strong) NSArray<UILabel *> *valueLabels;
          @property (nonatomic, strong) UILabel *toast;
          @property (nonatomic, strong) UIImpactFeedbackGenerator *haptic;
          @end

          @implementation UnitViewController

          - (UIStatusBarStyle)preferredStatusBarStyle { return UIStatusBarStyleLightContent; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.blackColor;
              self.haptic = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleLight];

              self.input = [NSMutableString string];

              // 길이 / 넓이 전환
              self.modeControl = [[UISegmentedControl alloc] initWithItems:@[@"길이", @"넓이"]];
              self.modeControl.translatesAutoresizingMaskIntoConstraints = NO;
              self.modeControl.selectedSegmentTintColor = UC_ORANGE;
              self.modeControl.backgroundColor = UC_BOX;
              [self.modeControl setTitleTextAttributes:@{NSForegroundColorAttributeName: UC_LIGHT,
                                                         NSFontAttributeName: [UIFont systemFontOfSize:16 weight:UIFontWeightSemibold]}
                                              forState:UIControlStateNormal];
              [self.modeControl setTitleTextAttributes:@{NSForegroundColorAttributeName: UIColor.whiteColor,
                                                         NSFontAttributeName: [UIFont systemFontOfSize:16 weight:UIFontWeightBold]}
                                              forState:UIControlStateSelected];
              [self.modeControl addTarget:self action:@selector(modeChanged) forControlEvents:UIControlEventValueChanged];
              [self.view addSubview:self.modeControl];

              UIView *display = [self buildDisplay];
              UIView *keypad = [self buildKeypad];
              [self.view addSubview:display];
              [self.view addSubview:keypad];

              self.toast = [[UILabel alloc] init];
              self.toast.translatesAutoresizingMaskIntoConstraints = NO;
              self.toast.backgroundColor = [UIColor colorWithWhite:0.25 alpha:0.95];
              self.toast.textColor = UIColor.whiteColor;
              self.toast.font = [UIFont systemFontOfSize:15 weight:UIFontWeightMedium];
              self.toast.textAlignment = NSTextAlignmentCenter;
              self.toast.layer.cornerRadius = 14;
              self.toast.clipsToBounds = YES;
              self.toast.alpha = 0;
              [self.view addSubview:self.toast];

              UILayoutGuide *safe = self.view.safeAreaLayoutGuide;
              [NSLayoutConstraint activateConstraints:@[
                  [keypad.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [keypad.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [keypad.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor constant:-8],
                  [keypad.heightAnchor constraintEqualToAnchor:keypad.widthAnchor multiplier:0.78],

                  [display.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [display.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [self.modeControl.topAnchor constraintEqualToAnchor:safe.topAnchor constant:6],
                  [self.modeControl.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor constant:16],
                  [self.modeControl.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor constant:-16],
                  [self.modeControl.heightAnchor constraintEqualToConstant:34],
                  [display.topAnchor constraintEqualToAnchor:self.modeControl.bottomAnchor constant:10],
                  [display.bottomAnchor constraintEqualToAnchor:keypad.topAnchor constant:-14],

                  [self.toast.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [self.toast.bottomAnchor constraintEqualToAnchor:keypad.topAnchor constant:-20],
                  [self.toast.heightAnchor constraintEqualToConstant:36],
                  [self.toast.widthAnchor constraintGreaterThanOrEqualToConstant:160],
              ]];
              [self setMode:[NSUserDefaults.standardUserDefaults integerForKey:@"mode"]];
          }

          #pragma mark - 모드

          // 길이: 기준 Å, 자주 쓰는 순서 / 넓이: 기준 m²
          - (void)setMode:(NSInteger)mode {
              _mode = (mode == 1) ? 1 : 0;
              if (_mode == 0) {
                  self.unitNames   = @[@"Å",  @"μm", @"nm", @"pm",  @"mm", @"cm", @"inch",   @"m"];
                  self.unitFactors = @[@1.0,  @1e4,  @10.0, @0.01,  @1e7,  @1e8,  @2.54e8,   @1e10];
              } else {
                  self.unitNames   = @[@"평",          @"m²", @"cm²", @"mm²", @"inch²",     @"ft²"];
                  self.unitFactors = @[@(400.0/121.0), @1.0,  @1e-4,  @1e-6,  @0.00064516, @0.09290304];
              }
              self.modeControl.selectedSegmentIndex = _mode;
              [NSUserDefaults.standardUserDefaults setInteger:_mode forKey:@"mode"];
              for (NSUInteger i = 0; i < self.unitLabels.count; i++) {
                  self.unitLabels[i].text = i < self.unitNames.count ? self.unitNames[i] : @"";
              }
              [self.input setString:@""];
              self.fresh = NO;
              self.hasHeld = NO;
              self.active = 0;
              [self refresh];
          }

          - (void)modeChanged {
              [self tick];
              [self setMode:self.modeControl.selectedSegmentIndex];
          }

          #pragma mark - 화면 구성

          - (UIView *)buildDisplay {
              NSMutableArray *rows = [NSMutableArray array];
              NSMutableArray *values = [NSMutableArray array];
              NSMutableArray *unitLabels = [NSMutableArray array];
              for (NSUInteger i = 0; i < 8; i++) {
                  UIView *row = [[UIView alloc] init];
                  row.backgroundColor = UC_BOX;
                  row.layer.cornerRadius = 12;
                  row.layer.borderWidth = 2;
                  row.tag = (NSInteger)i;
                  [row addGestureRecognizer:[[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(rowTapped:)]];
                  [row addGestureRecognizer:[[UILongPressGestureRecognizer alloc] initWithTarget:self action:@selector(rowLongPressed:)]];

                  UILabel *unit = [[UILabel alloc] init];
                  unit.translatesAutoresizingMaskIntoConstraints = NO;
                  [unitLabels addObject:unit];
                  unit.font = [UIFont systemFontOfSize:19 weight:UIFontWeightSemibold];
                  unit.textColor = UC_LIGHT;
                  [row addSubview:unit];

                  UILabel *val = [[UILabel alloc] init];
                  val.translatesAutoresizingMaskIntoConstraints = NO;
                  val.font = [UIFont monospacedDigitSystemFontOfSize:28 weight:UIFontWeightLight];
                  val.textAlignment = NSTextAlignmentRight;
                  val.adjustsFontSizeToFitWidth = YES;
                  val.minimumScaleFactor = 0.45;
                  [row addSubview:val];

                  [NSLayoutConstraint activateConstraints:@[
                      [unit.leadingAnchor constraintEqualToAnchor:row.leadingAnchor constant:16],
                      [unit.centerYAnchor constraintEqualToAnchor:row.centerYAnchor],
                      [unit.widthAnchor constraintEqualToConstant:64],
                      [val.leadingAnchor constraintEqualToAnchor:unit.trailingAnchor constant:8],
                      [val.trailingAnchor constraintEqualToAnchor:row.trailingAnchor constant:-16],
                      [val.centerYAnchor constraintEqualToAnchor:row.centerYAnchor],
                  ]];
                  [rows addObject:row];
                  [values addObject:val];
              }
              self.rows = rows;
              self.valueLabels = values;
              self.unitLabels = unitLabels;

              UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:rows];
              stack.axis = UILayoutConstraintAxisVertical;
              stack.spacing = 6;
              stack.distribution = UIStackViewDistributionFillEqually;
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              return stack;
          }

          - (UIButton *)keyWithTitle:(NSString *)title bg:(UIColor *)bg fg:(UIColor *)fg action:(SEL)action {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              [b setTitle:title forState:UIControlStateNormal];
              [b setTitleColor:fg forState:UIControlStateNormal];
              b.tintColor = fg;
              b.backgroundColor = bg;
              b.titleLabel.font = [UIFont systemFontOfSize:30 weight:UIFontWeightMedium];
              b.layer.cornerRadius = 20;
              [b addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
              return b;
          }

          - (UIStackView *)rowWith:(NSArray<UIView *> *)views {
              UIStackView *row = [[UIStackView alloc] initWithArrangedSubviews:views];
              row.spacing = 12;
              row.distribution = UIStackViewDistributionFillEqually;
              return row;
          }

          - (UIView *)buildKeypad {
              // 숫자 (왼쪽 3칸)
              NSMutableArray *digitRows = [NSMutableArray array];
              UIButton *seven = nil;
              for (NSArray *r in @[@[@"7", @"8", @"9"], @[@"4", @"5", @"6"], @[@"1", @"2", @"3"]]) {
                  NSMutableArray *btns = [NSMutableArray array];
                  for (NSString *d in r) {
                      UIButton *b = [self keyWithTitle:d bg:UC_DARK fg:UIColor.whiteColor action:@selector(digitTapped:)];
                      if ([d isEqualToString:@"7"]) seven = b;
                      [btns addObject:b];
                  }
                  [digitRows addObject:[self rowWith:btns]];
              }
              UIButton *zero = [self keyWithTitle:@"0" bg:UC_DARK fg:UIColor.whiteColor action:@selector(digitTapped:)];
              UIButton *dot = [self keyWithTitle:@"." bg:UC_DARK fg:UIColor.whiteColor action:@selector(digitTapped:)];
              UIStackView *last = [[UIStackView alloc] initWithArrangedSubviews:@[zero, dot]];
              last.spacing = 12;
              [digitRows addObject:last];
              UIStackView *digits = [[UIStackView alloc] initWithArrangedSubviews:digitRows];
              digits.axis = UILayoutConstraintAxisVertical;
              digits.spacing = 12;
              digits.distribution = UIStackViewDistributionFillEqually;

              // 오른쪽 열: ⌫ / AC / 복사 / 붙여넣기
              UIButton *back = [self keyWithTitle:nil bg:UC_LIGHT fg:UIColor.blackColor action:@selector(backTapped)];
              [back setImage:[UIImage systemImageNamed:@"delete.left"
                                     withConfiguration:[UIImageSymbolConfiguration configurationWithPointSize:22 weight:UIImageSymbolWeightMedium]]
                    forState:UIControlStateNormal];
              UIButton *clear = [self keyWithTitle:@"AC" bg:UC_LIGHT fg:UIColor.blackColor action:@selector(clearTapped)];
              clear.titleLabel.font = [UIFont systemFontOfSize:26 weight:UIFontWeightMedium];
              UIButton *copy = [self keyWithTitle:@"복사" bg:UC_ORANGE fg:UIColor.whiteColor action:@selector(copyTapped)];
              copy.titleLabel.font = [UIFont systemFontOfSize:20 weight:UIFontWeightSemibold];
              UIButton *paste = [self keyWithTitle:@"붙여넣기" bg:UC_ORANGE fg:UIColor.whiteColor action:@selector(pasteTapped)];
              paste.titleLabel.font = [UIFont systemFontOfSize:17 weight:UIFontWeightSemibold];
              paste.titleLabel.adjustsFontSizeToFitWidth = YES;
              UIStackView *right = [[UIStackView alloc] initWithArrangedSubviews:@[back, clear, copy, paste]];
              right.axis = UILayoutConstraintAxisVertical;
              right.spacing = 12;

              UIStackView *pad = [[UIStackView alloc] initWithArrangedSubviews:@[digits, right]];
              pad.spacing = 12;
              pad.translatesAutoresizingMaskIntoConstraints = NO;

              [NSLayoutConstraint activateConstraints:@[
                  [dot.widthAnchor constraintEqualToAnchor:seven.widthAnchor],
                  [right.widthAnchor constraintEqualToAnchor:seven.widthAnchor],
                  [back.heightAnchor constraintEqualToAnchor:last.heightAnchor],
                  [clear.heightAnchor constraintEqualToAnchor:last.heightAnchor],
                  [copy.heightAnchor constraintEqualToAnchor:last.heightAnchor],
              ]];
              return pad;
          }

          #pragma mark - 숫자 표시

          - (NSString *)superscript:(NSInteger)n {
              NSString *digits = @"⁰¹²³⁴⁵⁶⁷⁸⁹";
              NSString *s = [NSString stringWithFormat:@"%ld", (long)labs(n)];
              NSMutableString *out = [NSMutableString stringWithString:(n < 0 ? @"⁻" : @"")];
              for (NSUInteger i = 0; i < s.length; i++) {
                  NSUInteger d = (NSUInteger)([s characterAtIndex:i] - '0');
                  [out appendString:[digits substringWithRange:NSMakeRange(d, 1)]];
              }
              return out;
          }

          // 보기 좋은 숫자: 너무 크거나 작으면 1.5×10⁻⁶ 처럼
          - (NSString *)pretty:(double)v {
              if (v == 0) return @"0";
              double a = fabs(v);
              if (a >= 1e-4 && a < 1e12) {
                  NSNumberFormatter *f = [[NSNumberFormatter alloc] init];
                  f.numberStyle = NSNumberFormatterDecimalStyle;
                  f.usesSignificantDigits = YES;
                  f.maximumSignificantDigits = 10;
                  return [f stringFromNumber:@(v)];
              }
              NSInteger e = (NSInteger)floor(log10(a));
              double m = v / pow(10, (double)e);
              if (fabs(m) >= 9.9999995) { m /= 10; e += 1; }
              NSNumberFormatter *f = [[NSNumberFormatter alloc] init];
              f.numberStyle = NSNumberFormatterDecimalStyle;
              f.usesSignificantDigits = YES;
              f.maximumSignificantDigits = 7;
              return [NSString stringWithFormat:@"%@×10%@", [f stringFromNumber:@(m)], [self superscript:e]];
          }

          // 복사용/입력용 숫자 (쉼표 없음)
          - (NSString *)plain:(double)v {
              NSNumberFormatter *f = [[NSNumberFormatter alloc] init];
              f.locale = [NSLocale localeWithLocaleIdentifier:@"en_US_POSIX"];
              f.usesSignificantDigits = YES;
              f.maximumSignificantDigits = 12;
              double a = fabs(v);
              if (v != 0 && (a < 1e-6 || a >= 1e15)) f.numberStyle = NSNumberFormatterScientificStyle;
              else { f.numberStyle = NSNumberFormatterDecimalStyle; f.usesGroupingSeparator = NO; }
              return [f stringFromNumber:@(v)] ?: @"0";
          }

          // 입력 중인 글자를 1,234.5 처럼
          - (NSString *)prettyInput:(NSString *)s {
              if (!s.length) return @"0";
              NSRange dot = [s rangeOfString:@"."];
              NSString *intPart = dot.location == NSNotFound ? s : [s substringToIndex:dot.location];
              NSString *rest = dot.location == NSNotFound ? @"" : [s substringFromIndex:dot.location];
              NSNumberFormatter *f = [[NSNumberFormatter alloc] init];
              f.numberStyle = NSNumberFormatterDecimalStyle;
              f.maximumFractionDigits = 0;
              return [[f stringFromNumber:@(intPart.length ? intPart.longLongValue : 0)] stringByAppendingString:rest];
          }

          #pragma mark - 계산

          - (BOOL)hasInput { return self.input.length > 0 && ![self.input isEqualToString:@"."]; }

          // 지금 값이 있는지 (입력했거나, 단위를 바꾸며 이어받은 값)
          - (BOOL)hasValue { return (self.fresh && self.hasHeld) || [self hasInput]; }

          // 현재 값을 Å 로
          - (double)angstrom {
              if (self.fresh && self.hasHeld) return self.heldA;
              return self.input.doubleValue * self.unitFactors[(NSUInteger)self.active].doubleValue;
          }

          - (double)valueForUnit:(NSUInteger)i {
              return [self angstrom] / self.unitFactors[i].doubleValue;
          }

          - (void)refresh {
              BOOL has = [self hasValue];
              UIColor *dim = [UIColor colorWithWhite:0.35 alpha:1.0];
              for (NSUInteger i = 0; i < self.rows.count; i++) {
                  UIView *row = self.rows[i];
                  UILabel *val = self.valueLabels[i];
                  row.hidden = (i >= self.unitNames.count);
                  if (row.hidden) continue;
                  BOOL isActive = ((NSInteger)i == self.active);
                  row.layer.borderColor = isActive ? UC_ORANGE.CGColor : UIColor.clearColor.CGColor;
                  if (isActive && !(self.fresh && self.hasHeld)) {
                      val.text = [self prettyInput:self.input];
                      val.textColor = self.input.length ? UIColor.whiteColor : dim;
                  } else if (isActive) {
                      val.text = [self pretty:[self valueForUnit:i]];
                      val.textColor = UIColor.whiteColor;
                  } else {
                      val.text = has ? [self pretty:[self valueForUnit:i]] : @"0";
                      val.textColor = has ? UC_ORANGE : dim;
                  }
              }
          }

          #pragma mark - 입력

          - (void)tick { [self.haptic impactOccurred]; }

          // 다른 단위를 누르면 그 단위가 입력 칸이 됨 (값은 그대로 이어받음)
          - (void)rowTapped:(UITapGestureRecognizer *)g {
              [self tick];
              NSInteger idx = g.view.tag;
              if (idx == self.active) return;
              BOOL had = [self hasValue];
              double a = had ? [self angstrom] : 0;
              self.hasHeld = had;
              self.heldA = a;
              [self.input setString:@""];
              self.active = idx;
              self.fresh = YES; // 숫자를 누르면 새로 입력
              [self refresh];
          }

          - (void)rowLongPressed:(UILongPressGestureRecognizer *)g {
              if (g.state != UIGestureRecognizerStateBegan) return;
              [self copyUnit:(NSUInteger)g.view.tag];
          }

          - (void)digitTapped:(UIButton *)sender {
              [self tick];
              NSString *d = [sender titleForState:UIControlStateNormal];
              if (self.fresh) { [self.input setString:@""]; self.fresh = NO; self.hasHeld = NO; }
              NSMutableString *t = self.input;
              if (t.length >= kMaxLength) return;
              if ([d isEqualToString:@"."]) {
                  if ([t containsString:@"."]) return;
                  if (!t.length) [t appendString:@"0"];
              } else if ([t isEqualToString:@"0"]) {
                  [t setString:@""];
              }
              [t appendString:d];
              [self refresh];
          }

          - (void)backTapped {
              [self tick];
              if (self.fresh) {
                  // 이어받은 값을 고쳐 쓸 수 있게 글자로 바꿈
                  if (self.hasHeld) {
                      NSString *s = [self plain:[self valueForUnit:(NSUInteger)self.active]];
                      [self.input setString:([s rangeOfString:@"E"].location == NSNotFound ? s : @"")];
                  }
                  self.fresh = NO;
                  self.hasHeld = NO;
              }
              if (self.input.length) [self.input deleteCharactersInRange:NSMakeRange(self.input.length - 1, 1)];
              [self refresh];
          }

          - (void)clearTapped {
              [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
              [self.input setString:@""];
              self.fresh = NO;
              self.hasHeld = NO;
              self.active = 0; // 기준 단위(Å / 평)로 돌아감
              [self refresh];
          }

          - (void)copyTapped {
              [self copyUnit:(NSUInteger)self.active];
          }

          - (void)copyUnit:(NSUInteger)i {
              [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
              if (![self hasValue]) { [self showToast:@"복사할 값이 없어요"]; return; }
              NSString *text = [self plain:[self valueForUnit:i]];
              UIPasteboard.generalPasteboard.string = text;
              [self showToast:[NSString stringWithFormat:@"복사됨: %@ %@", text, self.unitNames[i]]];
          }

          // 붙여넣기: "1,234.5", "0.55 μm", "1.5e-6 m", "1.5×10⁻⁶ cm" 같은 글자를 읽음
          - (void)pasteTapped {
              [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
              NSString *raw = UIPasteboard.generalPasteboard.string;
              if (!raw.length) { [self showToast:@"붙여넣을 내용이 없어요"]; return; }

              NSMutableString *t = [[raw stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet] mutableCopy];
              [t replaceOccurrencesOfString:@"," withString:@"" options:0 range:NSMakeRange(0, t.length)];
              NSDictionary *sup = @{@"⁰": @"0", @"¹": @"1", @"²": @"2", @"³": @"3", @"⁴": @"4", @"⁵": @"5",
                                    @"⁶": @"6", @"⁷": @"7", @"⁸": @"8", @"⁹": @"9", @"⁻": @"-"};
              for (NSString *k in sup) [t replaceOccurrencesOfString:k withString:sup[k] options:0 range:NSMakeRange(0, t.length)];
              for (NSString *k in @[@"×10^", @"x10^", @"X10^", @"*10^", @"×10"]) {
                  [t replaceOccurrencesOfString:k withString:@"e" options:0 range:NSMakeRange(0, t.length)];
              }

              NSRegularExpression *re = [NSRegularExpression regularExpressionWithPattern:
                  @"^\\s*[-+]?((?:\\d+\\.?\\d*|\\.\\d+)(?:[eE][-+]?\\d+)?)\\s*([A-Za-z0-9μµÅ²평\\\"]*)\\s*$" options:0 error:nil];
              NSTextCheckingResult *m = [re firstMatchInString:t options:0 range:NSMakeRange(0, t.length)];
              if (!m) { [self showToast:@"숫자를 찾지 못했어요"]; return; }
              double v = [[t substringWithRange:[m rangeAtIndex:1]] doubleValue];
              NSString *unitText = [m rangeAtIndex:2].length ? [t substringWithRange:[m rangeAtIndex:2]] : @"";

              // 단위가 붙어 있으면 그 칸으로 이동 (다른 모드 단위면 모드도 전환)
              NSDictionary *lengthMap = @{@"å": @0, @"a": @0, @"ang": @0,
                                          @"μm": @1, @"µm": @1, @"um": @1,
                                          @"nm": @2, @"pm": @3, @"mm": @4, @"cm": @5,
                                          @"inch": @6, @"in": @6, @"\"": @6, @"m": @7};
              NSDictionary *areaMap = @{@"평": @0, @"py": @0, @"pyeong": @0,
                                        @"m²": @1, @"m2": @1, @"sqm": @1,
                                        @"cm²": @2, @"cm2": @2, @"mm²": @3, @"mm2": @3,
                                        @"inch²": @4, @"in²": @4, @"in2": @4, @"inch2": @4, @"sqin": @4,
                                        @"ft²": @5, @"ft2": @5, @"sqft": @5};
              NSString *key = unitText.lowercaseString;
              NSNumber *u = nil;
              if ((u = areaMap[key] ?: areaMap[unitText])) { if (self.mode != 1) [self setMode:1]; }
              else if ((u = lengthMap[key] ?: lengthMap[unitText])) { if (self.mode != 0) [self setMode:0]; }
              if (u) self.active = u.integerValue;

              NSString *plainText = [self plain:v];
              if ([plainText rangeOfString:@"E"].location == NSNotFound && plainText.length <= kMaxLength) {
                  [self.input setString:plainText];
                  self.fresh = NO;
                  self.hasHeld = NO;
              } else {
                  // 지수로만 나타낼 수 있는 값은 그대로 이어받기
                  [self.input setString:@""];
                  self.heldA = v * self.unitFactors[(NSUInteger)self.active].doubleValue;
                  self.hasHeld = YES;
                  self.fresh = YES;
              }
              [self refresh];
              [self showToast:[NSString stringWithFormat:@"붙여넣음: %@ %@", [self pretty:v], self.unitNames[(NSUInteger)self.active]]];
          }

          - (void)showToast:(NSString *)text {
              self.toast.text = [NSString stringWithFormat:@"   %@   ", text];
              [UIView animateWithDuration:0.15 animations:^{ self.toast.alpha = 1; } completion:^(BOOL f) {
                  [UIView animateWithDuration:0.3 delay:1.2 options:0 animations:^{ self.toast.alpha = 0; } completion:nil];
              }];
          }

          @end
          __EOF__
          cat > 'app/control' <<'__EOF__'
          Package: com.local.unitconv
          Name: UnitConv
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Simple length unit converter
          Maintainer: local
          Author: local
          Section: Utilities
          Depends: firmware (>= 14.0)
          __EOF__
          cat > 'app/main.m' <<'__EOF__'
          #import <UIKit/UIKit.h>
          #import "AppDelegate.h"

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          __EOF__
          find app -type f

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build IPA
        working-directory: app
        run: |
          make clean
          make stage FINALPACKAGE=1
          APP=UnitConv
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT/Payload"
          cp -R ".theos/_/Applications/$APP.app" "$OUT/Payload/"
          if command -v ldid >/dev/null; then ldid -S "$OUT/Payload/$APP.app/$APP"; fi
          cd "$OUT" && zip -qry "$APP.ipa" Payload
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: UnitConv-ipa
          path: out/*.ipa
